<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#f8fafc" />

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Formato del QR de pareo UDID -- hoy vs. propuesta</text>

  <!-- PANEL 1: HOY -->
  <rect x="30" y="60" width="560" height="380" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" />
  <text x="310" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">HOY -- payload de texto plano</text>

  <rect x="90" y="115" width="440" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="310" y="143" text-anchor="middle" font-size="13" fill="#334155">TV pide código -- GET /wind/request-udid-manual/</text>

  <line x1="310" y1="161" x2="310" y2="185" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="70" y="187" width="480" height="50" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6" />
  <text x="310" y="209" text-anchor="middle" font-size="12.5" fill="#7c2d12" font-weight="bold">QR = "{appName}:{code}:{temp_token}"</text>
  <text x="310" y="226" text-anchor="middle" font-size="11" fill="#9a3412">texto plano, sin versión, sin escape de ":"</text>

  <line x1="230" y1="237" x2="150" y2="270" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrowGreen)" />
  <line x1="390" y1="237" x2="470" y2="270" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrowRed)" />

  <rect x="60" y="272" width="220" height="55" rx="6" fill="#f0fdf4" stroke="#86efac" />
  <text x="170" y="294" text-anchor="middle" font-size="11.5" fill="#166534" font-weight="bold">App nativa (la única</text>
  <text x="170" y="309" text-anchor="middle" font-size="11.5" fill="#166534" font-weight="bold">que sabe parsearlo)</text>

  <rect x="360" y="272" width="220" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" />
  <text x="470" y="294" text-anchor="middle" font-size="11.5" fill="#991b1b" font-weight="bold">Cualquier otra cámara</text>
  <text x="470" y="309" text-anchor="middle" font-size="11.5" fill="#991b1b" font-weight="bold">/ QR reader genérico</text>

  <line x1="170" y1="327" x2="170" y2="352" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="470" y1="327" x2="470" y2="352" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="60" y="354" width="220" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="170" y="373" text-anchor="middle" font-size="11" fill="#334155">Login social manual +</text>
  <text x="170" y="388" text-anchor="middle" font-size="11" fill="#334155">udid/temp_token (2.2)</text>

  <rect x="360" y="354" width="220" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6" />
  <text x="470" y="374" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="bold">Texto plano sin acción</text>
  <text x="470" y="391" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="bold">callejón sin salida ✕</text>

  <!-- PANEL 2: PROPUESTA -->
  <rect x="610" y="60" width="560" height="700" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
  <text x="890" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">PROPUESTA -- QR como URL versionada</text>

  <rect x="650" y="115" width="480" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="890" y="143" text-anchor="middle" font-size="13" fill="#334155">TV pide código -- GET /wind/request-udid-manual/ (sin cambios)</text>

  <line x1="890" y1="161" x2="890" y2="185" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="650" y="187" width="480" height="56" rx="6" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.6" />
  <text x="890" y="210" text-anchor="middle" font-size="12.5" fill="#14532d" font-weight="bold">QR = https://backend.wind.do/l/v1/{udid}?t={temp_token}</text>
  <text x="890" y="227" text-anchor="middle" font-size="11" fill="#166534">URL real, con versión ("v1") y parámetros nombrados</text>

  <line x1="780" y1="243" x2="720" y2="278" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="890" y1="243" x2="890" y2="278" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="1000" y1="243" x2="1060" y2="278" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="640" y="280" width="180" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="730" y="302" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">App nativa instalada</text>
  <text x="730" y="317" text-anchor="middle" font-size="10.5" fill="#475569">(App Link / Universal Link)</text>
  <text x="730" y="331" text-anchor="middle" font-size="10.5" fill="#475569">abre directo, sin navegador</text>

  <rect x="800" y="280" width="180" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="890" y="302" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">Cualquier cámara,</text>
  <text x="890" y="317" text-anchor="middle" font-size="10.5" fill="#475569">app no instalada</text>
  <text x="890" y="331" text-anchor="middle" font-size="10.5" fill="#475569">abre navegador normal</text>

  <rect x="960" y="280" width="180" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="1050" y="302" text-anchor="middle" font-size="11" fill="#334155" font-weight="bold">Cualquier QR reader</text>
  <text x="1050" y="317" text-anchor="middle" font-size="10.5" fill="#475569">nunca es texto muerto</text>
  <text x="1050" y="331" text-anchor="middle" font-size="10.5" fill="#475569">siempre es un link válido</text>

  <line x1="730" y1="340" x2="730" y2="365" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="650" y="367" width="160" height="55" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="730" y="388" text-anchor="middle" font-size="10.5" fill="#334155">Login social + udid/</text>
  <text x="730" y="402" text-anchor="middle" font-size="10.5" fill="#334155">temp_token (2.2, sin</text>
  <text x="730" y="416" text-anchor="middle" font-size="10.5" fill="#334155">cambio de lógica)</text>

  <line x1="890" y1="340" x2="890" y2="365" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="815" y="367" width="150" height="34" rx="6" fill="#eff6ff" stroke="#60a5fa" />
  <text x="890" y="388" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="bold">Página web /l/v1/...</text>

  <line x1="890" y1="401" x2="820" y2="430" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="890" y1="401" x2="960" y2="430" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="740" y="432" width="160" height="55" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="820" y="452" text-anchor="middle" font-size="10.5" fill="#334155">¿Logueado? Sí --</text>
  <text x="820" y="466" text-anchor="middle" font-size="10.5" fill="#334155">autocompleta el código</text>
  <text x="820" y="480" text-anchor="middle" font-size="10.5" fill="#334155">en "Vincular dispositivo"</text>

  <rect x="900" y="432" width="160" height="55" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="980" y="452" text-anchor="middle" font-size="10.5" fill="#334155">¿Logueado? No --</text>
  <text x="980" y="466" text-anchor="middle" font-size="10.5" fill="#334155">pide login primero,</text>
  <text x="980" y="480" text-anchor="middle" font-size="10.5" fill="#334155">luego autocompleta</text>

  <line x1="1050" y1="340" x2="1050" y2="365" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrowGreen)" />
  <rect x="965" y="367" width="170" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6" />
  <text x="1050" y="388" text-anchor="middle" font-size="11" fill="#14532d" font-weight="bold">Siempre resuelve en</text>
  <text x="1050" y="402" text-anchor="middle" font-size="11" fill="#14532d" font-weight="bold">algo útil -- nunca</text>
  <text x="1050" y="416" text-anchor="middle" font-size="11" fill="#14532d" font-weight="bold">texto muerto</text>

  <!-- Notas -->
  <rect x="650" y="500" width="480" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="670" y="525" font-size="13" font-weight="bold" fill="#0f172a">Por qué es mejor</text>
  <text x="670" y="548" font-size="11.5" fill="#334155">1. Una sola cámara sirve para todo -- ya no hace</text>
  <text x="682" y="564" font-size="11.5" fill="#334155">falta una app específica para que el QR "sirva".</text>
  <text x="670" y="586" font-size="11.5" fill="#334155">2. "v1" en la ruta permite versionar el formato sin</text>
  <text x="682" y="602" font-size="11.5" fill="#334155">romper parsers ya escritos.</text>
  <text x="670" y="624" font-size="11.5" fill="#334155">3. Parámetros nombrados (?t=...) en vez de split</text>
  <text x="682" y="640" font-size="11.5" fill="#334155">por ":" -- nada se desalinea si un campo cambia.</text>
  <text x="670" y="662" font-size="11.5" fill="#334155">4. Conecta directo con "Vincular dispositivo" (el</text>
  <text x="682" y="678" font-size="11.5" fill="#334155">self-service de hoy), sin trabajo de mobile.</text>

  <text x="670" y="702" font-size="12" font-weight="bold" fill="#7c2d12">Costo real de este cambio</text>
  <text x="670" y="720" font-size="11" fill="#7c2d12">Backend: 1 página nueva ("/l/v1/"). Mobile: registrar</text>
  <text x="670" y="734" font-size="11" fill="#7c2d12">el dominio como App/Universal Link (una vez).</text>

  <rect x="30" y="470" width="560" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="50" y="495" font-size="13" font-weight="bold" fill="#0f172a">Riesgo real de migrar ahora</text>
  <text x="50" y="518" font-size="11.5" fill="#334155">No confirmado que ninguna app nativa ya haya</text>
  <text x="50" y="534" font-size="11.5" fill="#334155">programado un parser contra el formato actual --</text>
  <text x="50" y="550" font-size="11.5" fill="#334155">este es el mejor momento para cambiarlo, antes</text>
  <text x="50" y="566" font-size="11.5" fill="#334155">de que alguien construya algo contra el formato viejo.</text>
  <text x="50" y="588" font-size="11.5" fill="#b45309" font-weight="bold">Requiere coordinar con el equipo de TV (parsea la</text>
  <text x="50" y="604" font-size="11.5" fill="#b45309" font-weight="bold">respuesta) y con mobile (App/Universal Links).</text>

</svg>
